# Important Notes:
# Every field you add must be added to the root build.gradle expandProps map.

# Project
version = 2.2.0
group = net.mhaks.dustydecorations
java_version = 21

# Common
minecraft_version = 1.21.3
mod_name = Dusty Decorations
mod_authors = Flint Mischiff, Redkoopa (marioz170), Mhaks
mod_id = dustydecorations
license = MIT License
credits = Credit goes to Tip, Redkoopa, and Mhaks, as well as to anyone that supports our work and development on Discord and Github!
description = Dusty Decorations is a Minecraft mod that adds many decorative blocks, most of them themed around ports and markets, with a rustic feel!
homepage = https://github.com/Mhaks02/DustyDecorations

minecraft_version_range = [1.21.2, 1.21.4)
minecraft_version_range_semver = >=1.21.2 <1.21.4
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version = 1.21.3-20241023.131943
# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
parchment_minecraft = 1.21.3
parchment_version = 2024.12.07

geckolib_version = 4.7.3
geckolib_version_range = [4.7, 4.8)
geckolib_version_range_semver = >=4.7 <4.8

# Fabric
fabric_version = 0.114.1+1.21.3
fabric_loader_version = 0.19.5

# NeoForge
neoforge_version = 21.3.97
neoforge_loader_version_range = [4,)

# Gradle
org.gradle.jvmargs = -Xmx3G
org.gradle.daemon = false
